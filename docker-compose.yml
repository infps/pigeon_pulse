services:
  app:
    # Built by .github/workflows/docker-image.yml; APP_TAG pins a commit sha for rollback.
    image: ghcr.io/infps/pigeon_pulse:${APP_TAG:-latest}
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
