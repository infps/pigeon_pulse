# Builds the production image on GitHub's arm64 runner (matches the t4g EC2 box)
# and pushes it to GHCR. The server only pulls — building there OOMs the 2 GB host.
# Deploy after this finishes: infra/ansible → ansible-playbook site.yml
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/infps/pigeon_pulse:latest
            ghcr.io/infps/pigeon_pulse:${{ github.sha }}
          # NEXT_PUBLIC_* are inlined into the browser bundle, so they are public by
          # design — not secrets. Change both URLs here when the domain goes live.
          build-args: |
            NEXT_PUBLIC_API_URL=http://52.35.79.242
            NEXT_PUBLIC_AUTH_BASE_URL=http://52.35.79.242
            NEXT_PUBLIC_PUSHER_KEY=096f733f13b727c5f7d9
            NEXT_PUBLIC_PUSHER_CLUSTER=ap2
            NEXT_PUBLIC_WINDY_MAP_KEY=zmN9ThTPoR9GKqKdLLAu28TcqatqE0Wi
            R2_PUBLIC_URL=https://d1x25rlao84hn0.cloudfront.net
          cache-from: type=gha
          cache-to: type=gha,mode=max
